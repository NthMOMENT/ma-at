[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# submitIntent's extra tokenAddress param pushes the legacy codegen past the
# 16-slot EVM stack limit ("stack too deep") — via_ir resolves it.
via_ir = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
